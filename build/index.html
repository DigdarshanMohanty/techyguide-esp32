<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechyGuide — Block Coding</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script defer src="bundle.js"></script></head>
  <body class="mode-scratch">
    <!-- ── Header ─────────────────────────────────── -->
    <header id="appHeader" class="app-header"></header>

    <!-- ── Main Layout ────────────────────────────── -->
    <div id="pageContainer">
      <!-- Blockly workspace (always visible) -->
      <div id="blocklyDiv"></div>

      <!-- RIGHT PANE: Scratch mode (default) -->
      <div id="scratchPane" class="right-pane">
        <div id="stageContainer">
          <canvas id="stageCanvas" width="480" height="360"></canvas>
        </div>
        <div id="spritePanel">
          <!-- Sprite list populated by JS -->
        </div>
      </div>

      <!-- RIGHT PANE: Board mode (hidden by default) -->
      <div id="boardPane" class="right-pane" style="display: none;">
        <div class="pane-section-label">MicroPython (ESP32-Ready)</div>
        <pre id="generatedCode"><code></code></pre>
        <div id="uploadPanel"></div>
        <button id="uploadBtn">Upload / Generate Code</button>
      </div>
    </div>
  </body>
</html>
