<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechyGuide — Block Coding</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="mode-scratch">
    <!-- ── Header ─────────────────────────────────── -->
    <header id="appHeader" class="app-header"></header>

    <!-- ── Main Layout ────────────────────────────── -->
    <div id="pageContainer">
      <!-- Blockly workspace (always visible) -->
      <div id="blocklyDiv"></div>

      <!-- RIGHT PANE: Scratch mode (default) -->
      <div id="scratchPane" class="right-pane">
        <div id="stageContainer">
          <!-- Scratch Controls overlay -->
          <div id="scratchControls" class="scratch-controls">
            <button id="greenFlagBtn" class="control-btn flag-btn" title="Start">
              <svg width="24" height="24" viewBox="0 0 16 16" fill="none"><path d="M4 2v12M4 2l9 5-9 5" fill="#4CAF50" stroke="#4CAF50" stroke-width="1.5" stroke-linejoin="round"/></svg>
            </button>
            <button id="stopBtn" class="control-btn stop-btn" title="Stop">
              <svg width="24" height="24" viewBox="0 0 14 14" fill="none"><rect x="1" y="1" width="12" height="12" rx="2" fill="#E53935"/></svg>
            </button>
          </div>
          <div id="stageCanvas" style="width:480px;height:360px;overflow:hidden;"></div>
        </div>
        <!-- PictoBlox style Sprite properties/lists -->
        <div id="spritePanelContainer"></div>
      </div>

      <!-- RIGHT PANE: Board mode (hidden by default) -->
      <div id="boardPane" class="right-pane" style="display: none;">
        <div class="pane-section-label">MicroPython (ESP32-Ready)</div>
        <pre id="generatedCode"><code></code></pre>
        <div id="uploadPanel"></div>
        <button id="uploadBtn">Upload / Generate Code</button>
      </div>
    </div>
  </body>
</html>
