<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechyGuide Block Application</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body class="mode-scratch">

    <!-- ── Header (populated by ModeSwitcher.js) ───── -->
    <header id="appHeader"></header>

    <!-- ── Main Layout ────────────────────────────── -->
    <div id="pageContainer">

      <!-- Blockly workspace — always visible in BOTH modes -->
      <div id="blocklyDiv" class="workspace-area"></div>

      <!-- RIGHT PANE: Scratch mode — stage + sprite panel -->
      <div id="scratchPane" class="right-pane">

        <!-- Stage controls bar -->
        <div class="stage-controls" id="scratchControls">
          <button id="greenFlagBtn" class="stage-btn green-flag" title="Start (Space)">
            <i data-lucide="play" style="width:18px;height:18px;color:#4CBF56;"></i>
          </button>
          <button id="stopBtn" class="stage-btn stop-btn" title="Stop">
            <i data-lucide="square" style="width:16px;height:16px;color:#FC2F2F;" fill="#FC2F2F"></i>
          </button>
          <div class="stage-layout-btns" style="margin-left:auto;">
            <button class="layout-btn active" title="Stage right">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <rect x="1" y="1" width="7" height="12" rx="1" fill="currentColor" opacity="0.4"/>
                <rect x="9" y="1" width="4" height="12" rx="1" fill="currentColor"/>
              </svg>
            </button>
            <button class="layout-btn" title="Stage large">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <rect x="1" y="1" width="12" height="12" rx="1" fill="currentColor" opacity="0.7"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Stage canvas (4:3, PixiJS target) -->
        <div class="stage-canvas-wrap">
          <div id="stageCanvas" style="width:100%;height:100%;overflow:hidden;"></div>
        </div>

        <!-- Sprite properties + tray -->
        <div id="spritePanelContainer"></div>

      </div><!-- /scratchPane -->

      <!-- RIGHT PANE: Board mode — code editor + serial monitor -->
      <div id="boardPane" class="right-pane" style="display:none;">

        <!-- Board Stage sub-view (toggled from header pills) -->
        <div id="boardStageView" class="board-subview" style="display:none;">
          <div id="boardStageSlot"></div>
        </div>

        <!-- Board Code sub-view -->
        <div id="boardCodeView" class="board-subview">

          <div class="editor-header">
            <div class="file-tab" id="codeFileTab">
              <i data-lucide="file-code-2" style="width:16px;height:16px;"></i>
              <span id="codeFileName">sketch.ino</span>
            </div>
            <select class="env-dropdown" id="envDropdown">
              <option value="arduino">C++ (Arduino)</option>
              <option value="micropython">MicroPython</option>
            </select>
          </div>

          <!-- Code editor: gutter + textarea -->
          <div class="code-editor-body" id="codeEditorBody">
            <div class="code-gutter" id="codeGutter"></div>
            <textarea
              class="code-content code-textarea"
              id="codeContent"
              spellcheck="false"
              autocorrect="off"
              autocapitalize="off"
              data-gramm="false"
            ></textarea>
          </div>

          <div class="editor-footer">
            <button class="toolbar-btn" id="downloadCodeBtn">
              <i data-lucide="download" style="width:16px;height:16px;"></i>
              <span id="downloadBtnLabel">Download .ino</span>
            </button>
            <button class="toolbar-btn" id="uploadBtn">
              <i data-lucide="upload" style="width:16px;height:16px;"></i>
              <span id="uploadBtnLabel">Upload Code</span>
            </button>
            <span id="uploadStatus" style="font-size:11px;margin-left:auto;color:var(--text-muted);display:none;"></span>
          </div>

          <!-- Serial monitor -->
          <div id="serialMonitorContainer"></div>

        </div><!-- /boardCodeView -->
      </div><!-- /boardPane -->

    </div><!-- /pageContainer -->

    <!-- Hidden legacy element (kept for compatibility) -->
    <pre id="generatedCode" style="display:none;"><code></code></pre>
  </body>
</html>
