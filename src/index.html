<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechyGuide — Block Coding</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="mode-scratch">
    <!-- ── Header ─────────────────────────────────── -->
    <header id="appHeader" class="app-header"></header>

    <!-- ── Main Layout ────────────────────────────── -->
    <div id="pageContainer">
      <!-- Blockly workspace (always visible) -->
      <div id="blocklyDiv"></div>

      <!-- RIGHT PANE: Scratch mode (default) -->
      <div id="scratchPane" class="right-pane">
        <div id="stageContainer">
          <!-- Scratch Controls overlay -->
          <div id="scratchControls" class="scratch-controls">
            <button id="greenFlagBtn" class="control-btn flag-btn" title="Start">
              <svg width="20" height="20" viewBox="0 0 16 16" fill="none"><path d="M4 2v12M4 2l9 5-9 5" fill="#4CAF50" stroke="#4CAF50" stroke-width="1.5" stroke-linejoin="round"/></svg>
            </button>
            <button id="stopBtn" class="control-btn stop-btn" title="Stop">
              <svg width="20" height="20" viewBox="0 0 14 14" fill="none"><rect x="2" y="2" width="10" height="10" rx="1.5" fill="#d35400"/></svg>
            </button>
          </div>
          <div id="stageCanvas" style="width:480px;height:360px;overflow:hidden;"></div>
        </div>
        <!-- PictoBlox style Sprite properties/lists -->
        <div id="spritePanelContainer"></div>
      </div>

      <!-- RIGHT PANE: Board mode (hidden by default) -->
      <div id="boardPane" class="right-pane" style="display: none;">
        <!-- Code Editor Header -->
        <div class="code-editor-header">
          <div class="code-tab active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
            main.py
          </div>
          <span class="code-line-count" id="codeLineCount">0 lines</span>
        </div>

        <!-- Code Editor Body -->
        <div class="code-editor-body" id="codeEditorBody">
          <div class="code-gutter" id="codeGutter"></div>
          <div class="code-content" id="codeContent"># Add blocks to generate code</div>
        </div>

        <!-- Upload Panel Slot -->
        <div id="uploadPanel"></div>

        <!-- Code Actions -->
        <div class="code-editor-actions">
          <button class="code-action-btn code-action-btn--primary" id="uploadBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Upload Code
          </button>
          <button class="code-action-btn code-action-btn--secondary" id="downloadPyBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Download .py
          </button>
        </div>

        <!-- Hidden legacy elements (kept for compatibility) -->
        <pre id="generatedCode" style="display:none;"><code></code></pre>
      </div>
    </div>
  </body>
</html>
